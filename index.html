<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tech U — AI Assistant</title><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#090b10;--panel:#11151d;--line:#29313d;--text:#f5f7fb;--muted:#8e98a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.app{height:100vh;display:flex;overflow:hidden}.sidebar{width:270px;background:#10141b;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:13px;overflow:hidden}.logo img,.big-logo img{width:100%;height:100%;object-fit:cover}.brand b{display:block}.brand span{color:var(--muted);font-size:12px}
.newchat{margin:24px 0 18px;width:100%;padding:12px;border:1px solid #343d4a;background:#191f29;color:#fff;border-radius:11px;font-weight:600;cursor:pointer}.side-title{font-size:11px;color:#778293;text-transform:uppercase;letter-spacing:.1em}.history{color:#c9d0da;padding:9px;border-radius:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{margin-top:auto;color:#8c96a6;font-size:12px;display:flex;gap:8px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#61d49a}
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}header{height:78px;border-bottom:1px solid #202732;padding:16px 26px;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:12px}.live{border:1px solid #303947;color:#b4bdca;border-radius:999px;padding:6px 10px;font-size:11px}
.chat{flex:1;overflow:auto;padding:28px 18px 145px}.welcome{max-width:780px;margin:7vh auto 0;text-align:center}.big-logo{width:78px;height:78px;border-radius:23px;overflow:hidden;margin:0 auto 20px}.welcome h2{font-size:30px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0 0 25px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{background:var(--panel);border:1px solid #29313d;border-radius:14px;text-align:left;padding:17px;cursor:pointer;color:#fff}.card b{display:block;margin-bottom:6px}.card span{color:var(--muted);font-size:12px}
.msg{max-width:780px;margin:0 auto 17px}.bubble{display:inline-block;max-width:88%;padding:12px 15px;border-radius:15px;line-height:1.55;white-space:pre-wrap}.user{text-align:right}.user .bubble{background:#edf1f7;color:#101319}.assistant .bubble{background:#151b24;border:1px solid #252d39}.error .bubble{border-color:#7a3434}
.composer-wrap{position:absolute;left:50%;bottom:31px;transform:translateX(-50%);width:min(780px,calc(100% - 38px))}.composer{display:flex;gap:8px;padding:8px;background:#11151d;border:1px solid #303847;border-radius:17px}.composer textarea{flex:1;background:transparent;border:0;outline:0;color:#fff;resize:none;font:inherit;padding:11px;min-height:44px;max-height:120px}.send{width:44px;height:44px;border:0;border-radius:12px;background:#edf1f7;color:#111820;font-size:21px;cursor:pointer}.send:disabled{opacity:.35}.hint{text-align:center;color:#687384;font-size:10px;margin-top:7px}
@media(max-width:760px){.sidebar{display:none}header{padding:15px 17px}.chat{padding:20px 12px 130px}.welcome{margin-top:6vh}.welcome h2{font-size:25px}.cards{grid-template-columns:1fr}.composer-wrap{width:calc(100% - 20px);bottom:13px}.hint{display:none}}
</style></head>
<body>
<div class="app"><aside class="sidebar">
<div class="brand"><div class="logo"><img src="icon-192.png"></div><div><b>Tech U</b><span>AI Assistant</span></div></div>
<button class="newchat" onclick="newChat()">＋ New chat</button><div class="side-title">Recent</div><div id="history"></div>
<div class="status"><i class="dot"></i>Tech U AI</div>
</aside>
<main><header><div><h1>Tech U</h1><p>Ask anything, get a straight answer</p></div><div class="live">● Live</div></header>
<section class="chat" id="chat"><div class="welcome" id="welcome"><div class="big-logo"><img src="icon-192.png"></div><h2>What can I help with?</h2><p>Ask Tech U anything.</p>
<div class="cards"><button class="card" onclick="starter('Help me create a project plan.')"><b>Plan a project</b><span>Milestones and timeline</span></button>
<button class="card" onclick="starter('Explain neural networks in simple language.')"><b>Explain a concept</b><span>Simple technical explanations</span></button>
<button class="card" onclick="starter('Review this paragraph and improve it.')"><b>Review my writing</b><span>Clear, specific feedback</span></button></div></div></section>
<div class="composer-wrap"><div class="composer"><textarea id="input" rows="1" placeholder="Message Tech U..."></textarea><button class="send" id="send" disabled>↑</button></div><div class="hint">AI powered by OpenAI • Created by Uttam Singh</div></div>
</main></div>
<script>
const input=document.getElementById('input'),send=document.getElementById('send'),chat=document.getElementById('chat'),welcome=document.getElementById('welcome'),history=document.getElementById('history');
let messages=[];
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';send.disabled=!input.value.trim()}
input.addEventListener('input',resize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!send.disabled)sendMsg()}});send.onclick=sendMsg;
function starter(t){input.value=t;resize();sendMsg()}
function add(text,type){const row=document.createElement('div');row.className='msg '+type;const b=document.createElement('div');b.className='bubble';b.textContent=text;row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return row}
async function sendMsg(){const q=input.value.trim();if(!q)return;welcome.style.display='none';add(q,'user');messages.push({role:'user',content:q});const h=document.createElement('div');h.className='history';h.textContent=q;history.prepend(h);input.value='';resize();const loading=add('Thinking…','assistant');
try{const r=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});const data=await r.json();loading.remove();if(!r.ok)throw new Error(data.error||'Request failed');add(data.reply,'assistant');messages.push({role:'assistant',content:data.reply})}
catch(e){loading.remove();add('Sorry, the AI backend could not answer right now. '+e.message,'assistant error');}}
function newChat(){messages=[];location.reload()} resize();
</script></body></html>
